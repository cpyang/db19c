# ============================================================
# Role: grid — Oracle Grid Infrastructure 19c (19.3 base + RU 19.31)
#
# Install model (19c, proven in oracle_dr_on_aws/tests on OL8):
#   unzip grid_home.zip INTO the GI home (19c is install-in-place),
#   replace the bundled (19.3) OPatch — -applyRU fails with it —
#   then ONE gridSetup.sh -silent -applyRU on node1, which stages
#   the home to the peer over the grid ssh trust and configures the
#   cluster; root.sh node1 -> node2; asmca creates DATA + FRA.
#
#   stage=check     all nodes: media + ASM symlinks + NIC roles
#   stage=software  node1: extract, OPatch, RU unzip, gridSetup
#   stage=root      per node in order: orainstRoot.sh + root.sh
#   stage=dgs       node1: asmca DATA + FRA, cluster verify
#
# Exit-code law (tests 2026-10-15): gridSetup rc 254 = "Exit Status -2"
# = SILENT CONFIG ABORT. Only 0/6 are success. Never grep rc alone —
# confirm SEVERE-free in GridSetupActions log.
# ============================================================

- name: Resolve stage from play vars
  # Never overwrite grid_stage itself — set_fact OUTRANKS play vars and
  # pinned every later play to 'check' (db11g di 2026-10-21 20:36).
  set_fact:
    grid_phase: "{{ grid_stage | default('check') }}"

# ------------------------------------------------------------------ check
- name: Resolve NIC roles (the rsp needs interface NAMES, tests §1e)
  include_role:
    name: common
    tasks_from: resolve-interfaces
  when: grid_phase == 'check'

- name: Confirm GI media is visible on the staging mount
  stat:
    path: "{{ oracle_stage_dir }}/{{ item }}"
  loop:
    - "{{ gi_base_zip }}"
    - "{{ gi_ru_zip }}"
    - "{{ opatch_zip }}"
  register: grid_media
  failed_when: not grid_media.stat.exists
  when: grid_phase == 'check'

- name: Confirm ASM discovery symlinks exist
  stat:
    path: "/dev/oracleasm/disks/{{ item }}"
  loop: [CRS, DATA, FRA]
  register: asm_links
  # in a loop, `item` is the loop string; the per-item result is under
  # the REGISTERED name (db11g storage-role form — do not use item.stat)
  failed_when: not asm_links.stat.exists
  when: grid_phase == 'check'

# ------------------------------------------------------------------ software
- name: Create GI home dir (mode 775, grid-owned)
  file:
    path: "{{ grid_home }}"
    state: directory
    owner: grid
    group: "{{ oracle_installer_group }}"
    mode: '0775'
  when: grid_phase == 'software'

- name: Detect extracted GI software (gridSetup.sh sits at the HOME TOP in 19c)
  stat:
    path: "{{ grid_home }}/gridSetup.sh"
  register: gi_bin
  when: grid_phase == 'software'

- name: Extract GI base release INTO the home (node1 only)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ gi_base_zip }}"
    dest: "{{ grid_home }}"
    remote_src: true
    owner: grid
    group: "{{ oracle_installer_group }}"
  become_user: grid
  when:
    - grid_phase == 'software'
    - not gi_bin.stat.exists
    - inventory_hostname == groups['rac'][0]

- name: Replace bundled OPatch in the GI home (node1; NO existence guard)
  # The 19.3 base ships an OPatch too old for the 19.31 RU — 'opatch exists'
  # != 'OPatch current'; a skipped replace kills -applyRU (tests 2026-10-15).
  shell: |
    rm -rf {{ grid_home }}/OPatch
    unzip -q {{ oracle_stage_dir }}/{{ opatch_zip }} -d {{ grid_home }}
  become_user: grid
  when:
    - grid_phase == 'software'
    - inventory_hostname == groups['rac'][0]

- name: Stage RU directories
  file:
    path: "{{ ru_stage_dir }}/{{ item }}"
    state: directory
    owner: grid
    group: "{{ oracle_installer_group }}"
  loop: [gi, db]
  when: grid_phase == 'software'

- name: Extract GI RU (node1)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ gi_ru_zip }}"
    dest: "{{ ru_stage_dir }}/gi"
    remote_src: true
    owner: grid
    group: "{{ oracle_installer_group }}"
  become_user: grid
  when:
    - grid_phase == 'software'
    - inventory_hostname == groups['rac'][0]

- name: Detect whether the cluster is already CONFIGURED
  # /etc/oracle/olr.loc appears during gridSetup's config phase — the
  # guard that keeps a re-run from re-invoking a -applyRU session (~1 h).
  stat:
    path: /etc/oracle/olr.loc
  register: olr_loc
  when: grid_phase == 'software'

- name: Render grid_install.rsp
  template:
    src: grid.rsp.j2
    dest: "{{ grid_install_tmp }}/grid_install.rsp"
    owner: grid
    group: "{{ oracle_installer_group }}"
    mode: '0600'      # contains SYSASM/monitor passwords
  vars:
    pub_iface: "{{ hostvars[inventory_hostname].pub_iface | default(omit) }}"
    priv_iface: "{{ hostvars[inventory_hostname].priv_iface | default(omit) }}"
  when:
    - grid_phase == 'software'
    - inventory_hostname == groups['rac'][0]

- name: Resolve NIC roles for the rsp (standalone stage runs)
  include_role:
    name: common
    tasks_from: resolve-interfaces
  when:
    - grid_phase == 'software'
    - hostvars[inventory_hostname].pub_iface is not defined

- name: gridSetup -silent -applyRU (node1; stages peers; 45-90 min)
  command: >-
    {{ grid_home }}/gridSetup.sh -silent
    -applyRU {{ ru_stage_dir }}/gi/{{ gi_ru_id }}
    -responseFile {{ grid_install_tmp }}/grid_install.rsp
    -ignorePrereqFailure
  become_user: grid
  environment:
    TMPDIR: "{{ grid_install_tmp }}"
    LANG: en_US.UTF-8
  register: gi_setup
  failed_when: gi_setup.rc not in [0, 6]     # 254 = silent config abort
  timeout: 9000
  when:
    - grid_phase == 'software'
    - not olr_loc.stat.exists
    - inventory_hostname == groups['rac'][0]

- name: Confirm gridSetup configured without SEVERE (log is ground truth)
  shell: |
    L=$(ls -t {{ hostvars[groups['rac'][0]].ora_inventory | default(ora_inventory) }}/logs/GridSetupActions*/gridSetupActions*.log 2>/dev/null | head -1)
    [ -n "$L" ] || { echo "no gridSetupActions log"; exit 1; }
    grep -E "SEVERE" "$L" | head -5
    ! grep -qE "SEVERE" "$L"
  run_once: true
  delegate_to: "{{ groups['rac'][0] }}"
  become_user: grid
  changed_when: false
  when:
    - grid_phase == 'software'
    - gi_setup.rc is defined and gi_setup.rc in [0, 6]

# ------------------------------------------------------------------ root.sh
- name: Check CRS state on this node
  # NEVER trust rc: 'crsctl check crs' exited 0 while printing PRCO-2 on a
  # dead stack (db11g di 2026-10-22). Search stdout for CRS-4537.
  command: "timeout 60 {{ grid_home }}/bin/crsctl check crs"
  register: crs_up
  failed_when: false
  changed_when: false
  when: grid_phase == 'root'

- name: Run orainstRoot.sh (per node)
  command: "{{ ora_inventory }}/orainstRoot.sh"
  when:
    - grid_phase == 'root'
    - crs_up.stdout is not search('CRS-4537')

- name: Run GI root.sh (per node — node1 FIRST, join node second)
  # 19c root.sh is the cluster-join mechanism; order is a hard requirement.
  # EL8/EL9 do NOT need db11g's ohasd/inittab dance — systemd units are
  # installed by root.sh itself.
  command: "{{ grid_home }}/root.sh"
  register: rootsh
  failed_when: "'FAILURES' in rootsh.stdout | default('')"
  timeout: 3600
  when:
    - grid_phase == 'root'
    - crs_up.stdout is not search('CRS-4537')

- name: Wait for CRS on this node
  shell: "{{ grid_home }}/bin/crsctl check crs | grep -q 'CRS-4537'"
  register: crs_wait
  retries: 60
  delay: 20
  until: crs_wait.rc == 0
  changed_when: false
  when: grid_phase == 'root'

# ------------------------------------------------------------------ disk groups
- name: Create DATA + FRA disk groups (node1; asmca after root.sh)
  # Guard on the CRS RESOURCE TABLE, not asmcmd rc — 'dg_exists' returns 0
  # for nonexistent groups (tests rac2 2026-10-19, silent skipped creates).
  shell: |
    export ORACLE_HOME={{ grid_home }}
    {{ grid_home }}/bin/crsctl stat res -t | grep -q "ora.{{ item.name }}.dg" || \
      {{ grid_home }}/bin/asmca -silent -createDiskGroup \
        -diskGroupName {{ item.name }} \
        -diskString '{{ asm_diskstring }}' \
        -disk /dev/oracleasm/disks/{{ item.name }} \
        -redundancy EXTERNAL -au_size 4
  loop:
    - { name: "{{ asm_diskgroup_data }}" }
    - { name: "{{ asm_diskgroup_fra }}" }
  become_user: grid
  when: grid_phase == 'dgs'

- name: Cluster verification
  shell: |
    {{ grid_home }}/bin/crsctl check cluster -all | grep -c ONLINE | grep -qv 0
    {{ grid_home }}/bin/olsnodes -n -s
    {{ grid_home }}/bin/crsctl query css votedisk
    # Flex ASM: DGs have no standalone res STATE; verify through the ASM
    # instance itself. env REQUIRED — bare become_user:grid lsdg exits 0
    # on nothing and prints a misleading '0' (di 2026-10-26; -et flag and
    # ora.<dg>.dg resource queries are both dead ends in this model).
    # name is the LAST column of lsdg, MOUNTED the first — anchor on both
    {{ grid_home }}/bin/asmcmd lsdg | awk '/MOUNTED/ && $NF ~ /^(CRS|DATA|FRA)\/?$/ {n++} END {print n+0}' | grep -qv 0
  become_user: grid
  environment:
    ORACLE_HOME: "{{ grid_home }}"
    ORACLE_SID: "+ASM{{ node_num }}"
    ORACLE_BASE: /u01/app/grid
  register: verify_out
  changed_when: false
  when: grid_phase == 'dgs'

- name: Show verification
  debug:
    msg: "{{ verify_out.stdout_lines | default([]) }}"
  when: grid_phase == 'dgs'
