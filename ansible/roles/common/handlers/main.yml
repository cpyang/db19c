# ============================================================
# Role: common — handlers (EL9: chronyd replaces ntpd)
# ============================================================

- name: apply sysctl
  command: sysctl --system
  changed_when: true

- name: restart chronyd
  service:
    name: chronyd
    state: restarted

- name: restart dnsmasq
  service:
    name: dnsmasq
    state: restarted
