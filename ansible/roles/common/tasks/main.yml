# ============================================================
# Role: common — OS preparation for GI 19c + DB 19c/11g on EL9
# Ported from db11g's EL7 role. EL9 deltas (learned from the
# oracle_dr_on_aws/tests OL8 lab or this repo's own spike):
#   * NetworkManager STAYS ON (no network-scripts in EL9) — DNS is set on
#     the NM connections, not by writing /etc/resolv.conf (NM owns it).
#   * chrony replaces ntpd.
#   * grid user owns /u01/app/19.0.0; GI SID is +ASM<n>.
# Everything the 11.2/19c CVU actually checks is kept from the EL7 role.
# ============================================================

- name: Require per-host network vars (public_ip/private_ip/vip)
  assert:
    that:
      - hostvars[inventory_hostname].public_ip is defined
      - hostvars[inventory_hostname].private_ip is defined
      - hostvars[inventory_hostname].vip is defined
    fail_msg: "inventory host vars public_ip/private_ip/vip are mandatory (see inventory/hosts)"

# ---------------------------------------------------------------- packages
# Install FIRST: later tasks start services (dnsmasq, chronyd) whose units
# only exist once these land (db11g di-2026-10-21 lesson).
- name: Install Oracle prerequisite packages
  package:
    name: "{{ oracle_packages + time_packages }}"
    state: present

# ---------------------------------------------------------------- network/identity
- name: Set FQDN hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Configure /etc/hosts
  template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: '0644'

- name: "NSS: drop myhostname from the hosts lookup order"
  # nss_myhostname answers our own hostname with EVERY local address,
  # IPv6 link-local first; root.sh's ConfigNode then resolves the node to
  # fe80:: and VIP allocation dies PRKC-1168 (tests lab, 2026-10-15).
  # /etc/hosts above is complete, so plain files+dns is correct.
  replace:
    path: /etc/nsswitch.conf
    regexp: '^(hosts:\s*\S*)\s+myhostname'
    replace: '\1'

- name: Stop/disable firewalld
  service:
    name: firewalld
    state: stopped
    enabled: no
  ignore_errors: true   # disabled at bootstrap; belt and braces

- name: Resolve NIC roles by address
  include_tasks: resolve-interfaces.yml

# ---------------------------------------------------------------- DNS (NM-native)
# dnsmasq serves the zone (SCAN + names) from each node; resolution must
# point AT the node's own host-only address (CVU's DNS channel ignores
# loopback-only entries — tests §1e) with the peer as secondary. The NAT
# interface's DHCP DNS (10.0.2.3) must NOT win the merged resolver, hence
# ignore-auto-dns on it. EL9 has no PEERDNS/ifcfg to lean on.
- name: Configure local DNS (dnsmasq answers the scan/vip names)
  template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart dnsmasq

- name: Start dnsmasq
  service:
    name: dnsmasq
    state: started
    enabled: yes

- name: Find NM connection per NIC
  # 'nmcli -g NAME,DEVICE' emits one COLON-joined line, not columns
  # (first-run lesson 2026-10-26: awk on whitespace -> empty name ->
  # 'nmcli con mod ""' rc 10). Terse mode + cut is robust even for
  # names containing spaces.
  shell: |
    nmcli -t -f NAME,DEVICE connection show --active \
      | grep ":{{ item }}$" | cut -d: -f1 | head -1
  loop: [ "{{ pub_iface }}", "{{ nat_iface | default('eth0') }}" ]
  register: nm_con_names
  changed_when: false

- name: Point resolver at dnsmasq; ignore NAT DNS
  # 'nmcli con mod' is offline (no link flap); the reload in the next task
  # applies it.
  vars:
    peer_ips: "{{ groups['rac'] | reject('equalto', inventory_hostname) | map('extract', hostvars, 'public_ip') | list }}"
  block:
    - name: Set static DNS on the host-only connection
      command: >-
        nmcli con mod "{{ nm_con_names.results[0].stdout }}"
        ipv4.dns "{{ ([public_ip] + peer_ips) | join(',') }}"
        ipv4.dns-search "{{ domain_name }}"
        ipv4.ignore-auto-dns yes
        ipv4.dns-priority 1
    - name: Disable DHCP DNS on the NAT connection (keep its default route)
      command: nmcli con mod "{{ nm_con_names.results[1].stdout }}" ipv4.ignore-auto-dns yes
      when: nm_con_names.results[1].stdout | default('') | length > 0

- name: Re-apply NAT profile (DNS flags take effect)
  command: nmcli con up "{{ nm_con_names.results[1].stdout }}"
  when:
    - nm_con_names.results[1].stdout | default('') | length > 0
  changed_when: true

- name: "Re-apply host-only profile (async - flaps the ansible path ~2s)"
  command: nmcli con up "{{ nm_con_names.results[0].stdout }}"
  async: 30
  poll: 0
  changed_when: true

- name: Wait for the node to come back
  wait_for:
    host: "{{ public_ip }}"
    port: 22
    state: started
    delay: 5
    timeout: 120

- name: Assert the resolver now points at our dnsmasq
  shell: grep -q "{{ public_ip }}" /etc/resolv.conf && grep -q nameserver /etc/resolv.conf
  register: resolv_check
  retries: 20
  delay: 5
  until: resolv_check.rc == 0
  changed_when: false

- name: SCAN resolves via DNS (not just hosts file)
  shell: nslookup {{ scan_name }} 127.0.0.1 | grep -q "{{ scan_ip }}"
  register: scan_check
  retries: 10
  delay: 5
  until: scan_check.rc == 0
  changed_when: false

# ---------------------------------------------------------------- security/os
- name: SELinux status (bootstrap already set disabled; verify)
  command: getenforce
  register: getenforce_out
  changed_when: false

- name: Ensure SELinux disabled persistently
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=disabled'

- name: Reboot once if currently enforcing
  reboot:
    reboot_timeout: 420
  when: getenforce_out.stdout == 'Enforcing'

# ---------------------------------------------------------------- users
- name: Create Oracle groups with fixed GIDs (identical on every node)
  group:
    name: "{{ item.key }}"
    gid: "{{ item.value }}"
    state: present
  loop: "{{ os_groups | dict2items }}"

- name: Create oracle user
  user:
    name: oracle
    uid: 500
    group: "{{ oracle_installer_group }}"
    groups:
      - "{{ oracle_db_group }}"
      - "{{ oracle_asm_dba_group }}"
      - "{{ oracle_asm_group }}"   # OS SYSASM for dbca against +ASM (db11g
                                  # playbook-05 lesson: incomplete SYSASM auth
                                  # dies ORA-01017/01031 mid-create)
      - backupdba
      - dgdba
      - kmdba
      - racdba
    home: /home/oracle
    shell: /bin/bash
    # password_lock left alone: a fresh passwordless account has shadow '!'
    # and usermod refuses to unlock it to empty (db11g di-2026-10-21).
    append: true

- name: Create grid user (GI owner — must NOT be in dba)
  user:
    name: grid
    uid: 501
    group: "{{ oracle_installer_group }}"
    groups:
      - "{{ oracle_asm_group }}"
      - "{{ oracle_asm_dba_group }}"
      - "{{ oracle_asm_oper_group }}"
    home: /home/grid
    shell: /bin/bash
    append: true

- name: Sudo for oracle/grid (root.sh phase and installer CVU root checks)
  copy:
    content: "{{ item }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ item }}"
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  loop: [oracle, grid]

# ---------------------------------------------------------------- filesystems
- name: Oracle directory tree
  file:
    path: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default(oracle_installer_group) }}"
    mode: "{{ item.mode | default('0775') }}"
    state: directory
  loop:
    - { path: /u01, owner: root, mode: '0755' }
    - { path: /u01/app, owner: oracle }
    - { path: "{{ oracle_base }}", owner: oracle }
    - { path: "{{ oracle_base }}/admin", owner: oracle }
    - { path: /u01/app/grid, owner: grid }
    - { path: /u01/app/19.0.0, owner: grid }
    - { path: /u01/app/oracle/product/19.0.0, owner: oracle }
    - { path: /u01/app/oracle/product/11.2.0, owner: oracle }
    # /u01/media/{db19c,db11g} are NOT managed here: Vagrant creates
    # those vboxsf mountpoints at boot — setattr fails (ro mount).
    - { path: /u01/media, owner: oracle }
    - { path: /u01/patches, owner: grid }
    - { path: "{{ grid_install_tmp }}", mode: '1777' }   # installer scratch off /tmp
  loop_control:
    label: "{{ item.path }}"

- name: Kernel parameters
  template:
    src: sysctl.j2
    dest: /etc/sysctl.d/99-oracle-rac.conf
    owner: root
    group: root
    mode: '0644'
  notify: apply sysctl

- name: Mirror sysctl settings into /etc/sysctl.conf (CVU reads ONLY this file)
  # CVU exectask greps /etc/sysctl.conf for 'Configured value'; conf.d-only
  # installs fail kernel-parameter prechecks (db11g di-2026-10-24 trail).
  template:
    src: sysctl.j2
    dest: /etc/sysctl.conf
    owner: root
    group: root
    mode: '0644'

- name: Resource limits (drop-in, do NOT overwrite the managed limits.conf)
  template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/99-oracle-rac.conf
    owner: root
    group: root
    mode: '0644'

- name: Disable transparent huge pages (systemd unit, both knobs)
  copy:
    dest: /etc/systemd/system/disable-thp.service
    mode: '0644'
    content: |
      [Unit]
      Description=Disable transparent huge pages (Oracle workload)
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c "echo never > /sys/kernel/mm/transparent_hugepage/enabled && echo never > /sys/kernel/mm/transparent_hugepage/defrag"
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
  register: thp_unit

- name: THP unit daemon-reload + enable
  systemd:
    name: disable-thp
    daemon_reload: "{{ thp_unit is changed }}"
    enabled: yes
    state: started

# ---------------------------------------------------------------- ssh trust
# The installers' built-in Java ssh CANNOT read modern OpenSSH (ed25519 /
# new-format RSA) private keys — classic PEM, or it fails "invalid
# privatekey" while native ssh looks fine (both sibling labs' hardest
# lesson). Keys for oracle AND grid, every hop incl. self.
- name: Passwordless ssh trust for oracle and grid (all nodes, incl. self)
  vars:
    ssh_users: [oracle, grid]
  block:
    - name: Create ~/.ssh for each installer user
      file:
        path: "/home/{{ item }}/.ssh"
        state: directory
        owner: "{{ item }}"
        group: "{{ oracle_installer_group }}"
        mode: '0700'
      loop: "{{ ssh_users }}"

    - name: Generate classic-PEM RSA keypair per user (if absent)
      command: >-
        ssh-keygen -t rsa -b 2048 -m PEM -N '' -q
        -f /home/{{ item }}/.ssh/id_rsa
        -C {{ item }}@{{ short_name }}
      args:
        creates: /home/{{ item }}/.ssh/id_rsa
      become_user: "{{ item }}"
      loop: "{{ ssh_users }}"

    - name: Read local public keys
      slurp:
        src: "/home/{{ item }}/.ssh/id_rsa.pub"
      loop: "{{ ssh_users }}"
      register: local_pubs

    - name: Publish local key material to hostvars
      set_fact:
        # dict(zip(...)) is Jinja-native; items2 proved unavailable in the
        # controller/Jinja combo db11g uses (di 2026-10-21).
        cluster_pubs: >-
          {{ dict(ssh_users | zip(local_pubs.results
             | map(attribute='content') | map('b64decode') | map('trim') | list)) }}

    - name: Assemble authorized_keys for each user (every node's key)
      copy:
        content: |
          {% for node in groups['rac'] %}
          {{ hostvars[node].cluster_pubs[item] }} {{ item }}@{{ hostvars[node].short_name }}
          {% endfor %}
        dest: "/home/{{ item }}/.ssh/authorized_keys"
        owner: "{{ item }}"
        group: "{{ oracle_installer_group }}"
        mode: '0600'
      loop: "{{ ssh_users }}"

    - name: Collect host keys for every cluster name/IP (this node's view)
      shell: >-
        for h in {{ domain_name }} {{ groups['rac'] | map('regex_replace', '\.' ~ domain_name ~ '$', '') | join(' ') }} {{ short_name }}
        {% for n in groups['rac'] %}
        {{ hostvars[n].public_ip }} {{ hostvars[n].private_ip }} {{ hostvars[n].vip }}
        {% endfor %}
        {% for n in groups['rac'] %}{{ n }} {% endfor %}
        {{ scan_name }}; do ssh-keyscan -T 5 "$h" 2>/dev/null || true; done | sort -u
      # '|| true' PER HOP: EL9 OpenSSH keyscan exits 1 if ANY name lacks an
      # sshd (SCAN/VIP/domain) — EL7's binary always returned 0, which is
      # why db11g's pipefail never fired (di 2026-10-26).
      register: hostkeys_scan
      changed_when: false

    - name: Write known_hosts for each installer user
      copy:
        content: "{{ hostkeys_scan.stdout }}\n"
        dest: "/home/{{ item }}/.ssh/known_hosts"
        owner: "{{ item }}"
        group: "{{ oracle_installer_group }}"
        mode: '0644'
      loop: "{{ ssh_users }}"

# ---------------------------------------------------------------- time sync
- name: Chrony configuration (both nodes sync the same explicit server)
  template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart chronyd

- name: Chrony enabled and running
  service:
    name: chronyd
    state: started
    enabled: yes

# ---------------------------------------------------------------- profiles
- name: Shell profile (oracle -> 19c home)
  template:
    src: bash_profile.j2
    dest: /home/oracle/.bash_profile
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'
  vars:
    profile_base: "{{ oracle_base }}"
    profile_home: "{{ oracle_home }}"
    profile_sid: "{{ db_sid_prefix }}{{ node_num }}"

- name: 11g home env switcher (oracle)
  template:
    src: db11g.env.j2
    dest: /home/oracle/db11g.env
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0644'

- name: Shell profile (grid -> GI home)
  template:
    src: bash_profile.j2
    dest: /home/grid/.bash_profile
    owner: grid
    group: "{{ oracle_installer_group }}"
    mode: '0644'
  vars:
    profile_base: "{{ grid_base }}"
    profile_home: "{{ grid_home }}"
    profile_sid: "+ASM{{ node_num }}"

# ---------------------------------------------------------------- login PATH
- name: GI bin in the PAM default PATH (/etc/environment)
  # ssh non-interactive `bash -c` sources NEITHER .bash_profile NOR .bashrc,
  # yet OUI's probes run bare `olsnodes` remotely — missing PATH yields
  # "S_NO_HOST_CLUSTER_INFO"/INS-35354 no matter how healthy the stack is
  # (db11g di-2026-10-24, the SEVENTH root cause of that error).
  lineinfile:
    path: /etc/environment
    regexp: "^PATH="
    line: 'PATH="{{ grid_home }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'
    create: yes
    mode: "0644"

# ------------------------------------------- EL9 link prerequisite (19c too!)
- name: Create libpthread_nonshared.a link stub
  # EL9 glibc>=2.34 deleted it; BOTH the 19c client_sharedlib link (04
  # run-2 rac2: 'ld: cannot find /usr/lib64/libpthread_nonshared.a') and
  # 11g genclntsh name it explicitly. Empty-but-valid archive suffices.
  shell: |
    printf 'int __oracle_compat_stub(void){return 0;}\n' > /tmp/pstub.c
    cc -c /tmp/pstub.c -o /tmp/pstub.o
    ar rcs /usr/lib64/libpthread_nonshared.a /tmp/pstub.o
  args:
    creates: /usr/lib64/libpthread_nonshared.a

# ------------------------------------------------ root disk into 60G primary
- name: Grow root FS into unpartitioned tail of the 60G primary disk
  # Box ships a 32G LV on a larger disk when Vagrantfile sets primary
  # 60GB (db11g's 32G sufficed for 11g; GI+RU+2 homes overflow it — rac1
  # hit 100% at RU staging, 04 run-2 2026-10-26). Fully idempotent:
  # growpart rc2=already-max, pvresize/lvextend/xfs_growfs no-op on rerun.
  shell: |
    set -e
    pv=$(pvs --noheadings -o pv_name | tr -d ' ' | head -1)
    dev=$(basename "$(lsblk -no pkname "$pv")")
    num=${pv##*[a-z]}
    growpart /dev/$dev $num || [ $? -eq 2 ] || exit 1
    partprobe /dev/$dev; sleep 2   # else pvresize sees stale size (2-run bug)
    pvresize "$pv" >/dev/null
    lvextend -l +100%FREE /dev/mapper/vg_main-lv_root 2>/dev/null || true
    xfs_growfs / >/dev/null
    df -B1 / | awk 'NR==2{printf "%.0fG", $2/1073741824}'
  register: grow_out
  changed_when: '"G" in grow_out.stdout and grow_out.stdout != "32G"'
