# ============================================================
# Role: database — Oracle RDBMS 19c software (EE, base 19.3 + RU 19.31)
#
# 19c install model (proven by oracle_dr_on_aws/tests on OL8):
# unzip db_home.zip INTO the home, replace bundled OPatch, then a
# PER-NODE local `runInstaller -silent -applyRU` listing only the local
# node in CLUSTER_NODES. The node1-drives-everything style trips base-19.3
# CVU remote checks (INS-06006/PRVF-5311) — per-node install bypasses CVU
# networking entirely (tests 2026-10-16 postmortem).
#
#   stage=check     media present
#   stage=software  per node: extract, OPatch, RU, image-install
#   stage=root      per node: $OH/root.sh
#   stage=verify    bin/oracle size + setuid + RU registered
# ============================================================

- name: Resolve stage from play vars
  set_fact:
    db_phase: "{{ db_stage | default('check') }}"

# ------------------------------------------------------------------ check
- name: Confirm DB media is visible on the staging mount
  stat:
    path: "{{ oracle_stage_dir }}/{{ item }}"
  loop:
    - "{{ db_base_zip }}"
    - "{{ db_ru_zip }}"
    - "{{ opatch_zip }}"
  register: db_media
  failed_when: not db_media.stat.exists
  when: db_phase == 'check'

# ------------------------------------------------------------------ software
- name: Create DB home dir
  file:
    path: "{{ oracle_home }}"
    state: directory
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0775'
  when: db_phase == 'software'

- name: Detect extracted DB software (bin/sqlplus appears in the zip extract)
  stat:
    path: "{{ oracle_home }}/bin/sqlplus"
  register: db_bin_sqlplus
  when: db_phase == 'software'

- name: Extract DB base release INTO the home (per node)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ db_base_zip }}"
    dest: "{{ oracle_home }}"
    remote_src: true
    owner: oracle
    group: "{{ oracle_installer_group }}"
  become_user: oracle
  when:
    - db_phase == 'software'
    - not db_bin_sqlplus.stat.exists

- name: Replace bundled OPatch in the DB home (per node; NO existence guard)
  shell: |
    rm -rf {{ oracle_home }}/OPatch
    unzip -q {{ oracle_stage_dir }}/{{ opatch_zip }} -d {{ oracle_home }}
  become_user: oracle
  when: db_phase == 'software'

- name: Ensure DB RU staging dir exists (oracle-owned)
  # /u01/patches is grid-owned from the GI phase; oracle cannot mkdir
  # inside it -> unarchive rc50 'Permission denied', 04 run-1 2026-10-26.
  file:
    path: "{{ ru_stage_dir }}/db"
    state: directory
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0775'
  when: db_phase == 'software'

- name: Extract DB RU (per node — install is local)
  unarchive:
    src: "{{ oracle_stage_dir }}/{{ db_ru_zip }}"
    dest: "{{ ru_stage_dir }}/db"
    remote_src: true
    owner: oracle
    group: "{{ oracle_installer_group }}"
  become_user: oracle
  when: db_phase == 'software'

- name: Check current bin/oracle state
  stat:
    path: "{{ oracle_home }}/bin/oracle"
  register: db_bin
  when: db_phase == 'software'

- name: Decide whether link/install must run
  # size guard OR explicit -e db_force_install=true (aborted-but-
  # prelinked homes need the make targets replayed; 04 run-3 stat-shim)
  set_fact:
    db_link_state: "{{ (db_bin.stat.size | default(0) < 1000000) or (db_force_install | default(false)) }}"
  when: db_phase == 'software'

- name: Detach stale DB home registrations (recovery guard)
  # INS-32826 comes from TWO registries: central inventory entries surviving
  # a wiped home AND the home-local $OH/inventory marker detachHome itself
  # leaves. Flagless detach silently no-ops — use the full incantation
  # (tests rac1 2026-10-16).
  shell: |
    if grep -q 'LOC="{{ oracle_home }}"' {{ ora_inventory }}/ContentsXML/inventory.xml 2>/dev/null \
         && [ ! -s {{ oracle_home }}/bin/oracle ]; then
      {{ oracle_home }}/runInstaller -detachHome -silent -force -local \
        -oracleHome {{ oracle_home }} 2>&1 | tail -4
      [ -d {{ oracle_home }}/inventory ] && rm -rf {{ oracle_home }}/inventory
      echo DETACHED_STALE_HOME
    fi
  become_user: oracle
  when:
    - db_phase == 'software'
    - db_bin.stat.size | default(0) < 1000000

- name: Render db_install.rsp (per node)
  template:
    src: db_install19.rsp.j2
    dest: "{{ grid_install_tmp }}/db_install19.rsp"
    owner: oracle
    group: "{{ oracle_installer_group }}"
    mode: '0600'
  when: db_phase == 'software'

- name: Install EL9 glibc stat-shim into the DB home lib path
  # 19.3's KAP-built libnnzst19.a objects reference the glibc<2.33 `stat`
  # symbol (EL9 dropped it from the ABI) -> linking rdbms/lib/orion is
  # FATAL and kills all_no_orcl even though bin/oracle ships pre-linked
  # (04 run-3 2026-10-26). Static fstatat wrappers appended to the home's
  # sysliblist resolve it; RU 19.31 replaces the object at patch phase.
  shell: |
    printf '#define _GNU_SOURCE 1\n#include <sys/syscall.h>\n#include <sys/stat.h>\n#include <sys/statfs.h>\n#include <fcntl.h>\n#include <unistd.h>\n#include <sys/sysmacros.h>\nstatic int xst(const char *p, struct stat *s, int f){return syscall(SYS_newfstatat, AT_FDCWD, p, s, f);}\nint stat(const char *p, struct stat *s){return xst(p,s,0);}\nint lstat(const char *p, struct stat *s){return xst(p,s,AT_SYMLINK_NOFOLLOW);}\nint fstat(int fd, struct stat *s){return syscall(SYS_newfstatat, fd, "", s, AT_EMPTY_PATH);}\nint mknod(const char *p, mode_t m, dev_t d){return syscall(SYS_mknod, p, m, d);}\n' > {{ grid_install_tmp }}/statshim.c
    cc -fPIC -c {{ grid_install_tmp }}/statshim.c -o {{ grid_install_tmp }}/statshim.o
    # EL9 glibc exports stat/lstat/fstat ONLY as weak @GLIBC_2.33
    # wrappers; unversioned KAP-built 19.3 objects (libnnzst, libjavavm)
    # fail to bind them -> 'undefined reference' (04 run-5/6,
    # 2026-10-26). Strong syscall(2)-based definitions in this archive
    # resolve the whole family at archive-scan time.
    ar rcs {{ oracle_home }}/lib/libstatshim.a {{ grid_install_tmp }}/statshim.o
    grep -q statshim {{ oracle_home }}/lib/sysliblist || echo -n ' -lstatshim' >> {{ oracle_home }}/lib/sysliblist
    # OUI target order links libasmperl19.ohso BEFORE client_sharedlib
    # builds libclntshcore.so -> fresh homes die 'cannot find
    # -lclntshcore' (rac2 run-6; rac1 only passed on stale residue).
    # Build the core client libs first when absent (idempotent).
    test -e {{ oracle_home }}/lib/libclntshcore.so || \
      (cd {{ oracle_home }}/rdbms/lib && ORACLE_HOME={{ oracle_home }} make -f ins_rdbms.mk client_sharedlib)
  become_user: oracle
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
  when:
    - db_phase == 'software'
    - db_link_state

- name: Install DB software (per node, local image install, base 19.3)
  # NO -applyRU here: its validation requires the home UNregistered
  # (INS-32826) while its opatchauto step requires it REGISTERED
  # (OPatch err 135) — proven circularity in tests lab. RU lands in the
  # 'patch' phase via opatch apply -local per node instead.
  command: >-
    {{ oracle_home }}/runInstaller -silent
    -responseFile {{ grid_install_tmp }}/db_install19.rsp
    oracle.install.db.CLUSTER_NODES={{ short_name }}
    -ignorePrereqFailure
  become_user: oracle
  environment:
    # 19.3 base CVU has no OL9 entry -> INS-08101 NPE (same class as OL8's);
    # the DISTID marker keeps the preinstall check quiet (tests lab §db).
    CV_ASSUME_DISTID: OEL7.8
    TMPDIR: "{{ grid_install_tmp }}"
  register: db_install
  failed_when: db_install.rc not in [0, 6]
  timeout: 5400
  when:
    - db_phase == 'software'
    - db_link_state

# ------------------------------------------------------------------ patch
- name: Apply DB RU with OPatch (per node, post-install)
  shell: |
    {{ oracle_home }}/OPatch/opatch lspatches 2>/dev/null | grep -q "^{{ db_ru_id }};" || \
      (cd {{ ru_stage_dir }}/db/{{ db_ru_id }} && {{ oracle_home }}/OPatch/opatch apply -silent -local)
  become_user: oracle
  register: db_patch
  changed_when: "'already installed' not in db_patch.stdout | default('')"
  timeout: 3600
  when: db_phase == 'patch'

# ------------------------------------------------------------------ root.sh
- name: DB home already rooted? (setuid oracle binary)
  shell: "stat -c '%A' {{ oracle_home }}/bin/oracle | grep -q '^.-ws'"
  register: db_setuid
  failed_when: false
  changed_when: false
  when: db_phase == 'root'

- name: Run $OH/root.sh (per node)
  command: "{{ oracle_home }}/root.sh"
  register: dbroot
  failed_when: "'FAILURES' in dbroot.stdout | default('')"
  timeout: 1800
  when:
    - db_phase == 'root'
    - db_setuid.rc != 0

# ------------------------------------------------------------------ verify
- name: Verify DB home
  # bin/oracle SIZE matters: a home whose install never finished keeps the
  # zip's 0-byte placeholder (db11g lesson, applies to 19c the same way).
  shell: |
    test $(stat -c %s {{ oracle_home }}/bin/oracle) -gt 1000000
    stat -c '%A' {{ oracle_home }}/bin/oracle | grep -q '^.-ws'
    {{ oracle_home }}/OPatch/opatch lspatches | grep -q "^{{ db_ru_id }};"
  become_user: oracle
  changed_when: false
  when: db_phase == 'verify'
