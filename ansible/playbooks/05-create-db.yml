# ============================================================
# Playbook 05 — create BOTH databases on GI 19c
#   A) db19c — 19c RAC CDB (node1 instance at create, node2 via addInstance)
#   B) db11  — 11.2.0.4 single instance, registered through 19c srvctl
#
# 19c grammar = oracle_dr_on_aws/tests lab's proven path (create on node1,
# dbca -addInstance for node2, ORA_DISABLED_CVU_CHECKS=SCAN for the base
# TaskNameService phantom — the DNS itself is verified in playbook 01).
#
# BEFORE first real run, sanity-check the 11g dbca grammar on the VM
# (db11g README lesson — 11.2 dbca is picky about -sid/-nodeList
# interaction and this combination [11g dbca + 19c GI] is the lab's
# one non-standard pairing):
#   vagrant ssh db19c-rac1 -c "sudo -u oracle ORACLE_HOME=/u01/app/oracle/product/11.2.0/dbhome_1 /u01/app/oracle/product/11.2.0/dbhome_1/bin/dbca -help"
#   (spike note: 11g dbca rejects '-createDatabase -help' — plain -help
#    prints the full -createDatabase grammar)
#
# Run: ansible-playbook playbooks/05-create-db.yml
#      ansible-playbook playbooks/05-create-db.yml --tags db19   (or db11)
# ============================================================

# -------------------------------------------------------------- A) 19c CDB
- name: Create RAC CDB db19c (19.31)
  hosts: rac[0]
  gather_facts: false
  become: true
  tags: [db19]
  vars:
    db_home_env:
      ORACLE_HOME: "{{ oracle_home }}"
      PATH: "{{ oracle_home }}/bin:/usr/bin:/bin"
      HOME: /home/oracle
      CV_ASSUME_DISTID: OEL7.8
      ORA_DISABLED_CVU_CHECKS: SCAN
  tasks:
    - name: Check whether db19c is already registered with GI
      command: "{{ grid_home }}/bin/srvctl config database -d {{ db_name }}"
      become_user: grid
      register: db19_registered
      failed_when: false
      changed_when: false

    - name: dbca create the CDB on node1 (30-60 min)
      command: >-
        {{ oracle_home }}/bin/dbca -silent -createDatabase
        -templateName {{ dbca_template }}
        -gdbName {{ db_name }}
        -sid {{ db_sid_prefix }}1
        -sysPassword {{ sys_password }}
        -systemPassword {{ system_password }}
        -emConfiguration NONE
        -storageType ASM
        -diskGroupName {{ asm_diskgroup_data }}
        -recoveryAreaDestination +{{ asm_diskgroup_fra }}
        -recoveryAreaSize 9216
        -characterSet {{ db_charset }}
        -nationalCharacterSet {{ db_ncharset }}
        -memoryPercentage {{ db_memory_percentage }}
        -databaseType MULTIPURPOSE
        -sampleSchema false
        -createAsContainerDatabase true
        -numberOfPDBs 1
        -pdbName {{ pdb_name }}
        -pdbAdminPassword {{ system_password }}
        -initParams db_unique_name={{ db_unique_name }}
      become_user: oracle
      environment: "{{ db_home_env }}"
      register: dbca19
      timeout: 7200
      changed_when: true
      when: db19_registered.rc != 0

    - name: Extend db19c to two instances (srvctl manual RAC registration)
      # dbca cluster verbs (create -nodelist / -addInstance) die in
      # INS-06006 on EL9 even though every ssh probe returns rc0 and the
      # trace logs the node as reachable - the OPS layer lies (~10 runs,
      # 2026-10-26/27). This CRS-local sequence is the VERIFIED recipe
      # (skill refs srvctl-manual-rac-registration.md): spfile stamping in
      # the OPEN session, srvctl re-register as oracle owner (root gets
      # PRKH-1014, grid CRS-0245), add instance per node, nomount-overlay
      # fixes instance_number (ORA-29760 otherwise), srvctl start.
      shell: |
        set -x
        if {{ grid_home }}/bin/srvctl status database -d {{ db_name }} \
             | grep -q "{{ db_sid_prefix }}2"; then echo ALREADY; exit 0; fi
        export ORACLE_HOME={{ oracle_home }} PATH={{ oracle_home }}/bin:$PATH
        export ORACLE_SID={{ db_sid_prefix }}1
        sqlplus -s / as sysdba <<'SQL'
        create undo tablespace UNDOTBS2 datafile '+DATA' size 512M autoextend on maxsize 8G;
        alter system set undo_tablespace='UNDOTBS2' scope=spfile sid='{{ db_sid_prefix }}2';
        alter system set instance_number=2 scope=spfile sid='{{ db_sid_prefix }}2';
        alter system set cluster_database=true scope=spfile sid='*';
        exit
        SQL
        {{ grid_home }}/bin/srvctl stop database -d {{ db_name }} -f 2>/dev/null
        SPF=$({{ grid_home }}/bin/srvctl config database -d {{ db_name }} 2>/dev/null | awk -F': ' '/Spfile/{print $2}')
        if [ -z "$SPF" ]; then SPF=$({{ grid_home }}/bin/asmcmd ls +DATA/{{ db_name | upper }}/PARAMETERFILE 2>/dev/null | grep spfile | head -1); SPF="+DATA/{{ db_name | upper }}/PARAMETERFILE/$SPF"; fi
        echo SPFILE=$SPF
        {{ grid_home }}/bin/srvctl remove database -d {{ db_name }} -f 2>/dev/null
        # NO -i/-n on add database: single-dash -n parses as a -dbname prefix (PRKF-1125)
        {{ grid_home }}/bin/srvctl add database -db {{ db_name }} -o {{ oracle_home }} -p "$SPF"
        {{ grid_home }}/bin/srvctl add instance -db {{ db_name }} -i {{ db_sid_prefix }}1 -n {{ hostvars[groups['rac'][0]].short_name }}
        {{ grid_home }}/bin/srvctl add instance -db {{ db_name }} -i {{ db_sid_prefix }}2 -n {{ hostvars[groups['rac'][1]].short_name }}
        # nomount-overlay: db191 needs its instance_number in spfile (ORA-29760)
        printf 'spfile=%s\ndb_name={{ db_name }}\ninstance_number=1\ncluster_database=false\n' "$SPF" > /tmp/{{ db_name }}_p1.ora
        sqlplus -s / as sysdba <<'SQL'
        startup nomount pfile='/tmp/{{ db_name }}_p1.ora'
        alter system set instance_number=1 scope=spfile sid='{{ db_sid_prefix }}1';
        alter system set cluster_database=true scope=spfile sid='*';
        shutdown immediate
        exit
        SQL
        {{ grid_home }}/bin/srvctl start database -d {{ db_name }}
        {{ grid_home }}/bin/srvctl status database -d {{ db_name }} | grep -c "is running"
      become_user: oracle
      register: extend_out
      timeout: 3600
      changed_when: "'ALREADY' not in extend_out.stdout"

    - name: Start db19c, both instances
      shell: |
        {{ grid_home }}/bin/srvctl start database -d {{ db_name }} 2>&1 \
          | grep -v PRCC-1014 || true
        {{ grid_home }}/bin/srvctl status database -d {{ db_name }}
      become_user: grid
      register: db19_status
      changed_when: true

    - name: Assert db19c has 2 running instances
      assert:
        that: (db19_status.stdout | regex_findall('is running')) | length == 2
        fail_msg: "db19c instances:\n{{ db19_status.stdout }}"
      changed_when: false

# -------------------------------------------------------------- B) 11g single instance
- name: Create 11.2.0.4 database db11 (single instance under GI 19c)
  hosts: rac[0]
  gather_facts: false
  become: true
  tags: [db11]
  vars:
    db11_env:
      ORACLE_HOME: "{{ oracle11_home }}"
      PATH: "{{ oracle11_home }}/bin:/usr/bin:/bin"
      HOME: /home/oracle
  tasks:
    - name: Check whether db11 is already registered
      # physical-existence OR registration suppresses re-create: the
      # register step (not this play) owns CRS, and a dbca -createDatabase
      # over an existing +DATA/DB11 would abort the play.
      shell: |
        {{ grid_home }}/bin/srvctl config database -d {{ db11_name }} >/dev/null 2>&1 \
          || {{ grid_home }}/bin/asmcmd ls +{{ asm_diskgroup_data }}/{{ db11_name | upper }}/DATAFILE >/dev/null 2>&1
      become_user: grid
      register: db11_registered
      failed_when: false
      changed_when: false

    # 11g dbca detects the running cluster via /etc/oracle/olr.loc and
    # would try to create/register a RAC-style resource through 11.2
    # binaries that no longer own the stack here — cluster_database=false
    # in -initParams keeps dbca creating a plain single-instance DB.
    # Cluster registration then happens once, explicitly, from 19c srvctl.
    - name: dbca create db11 from the 11g home (30-60 min)
      command: >-
        {{ oracle11_home }}/bin/dbca -silent -createDatabase
        -templateName {{ oracle11_home }}/assistants/dbca/templates/General_Purpose.dbc
        -gdbName {{ db11_name }}
        -sid {{ db11_sid }}
        -sysPassword {{ sys_password }}
        -systemPassword {{ system_password }}
        -dbsnmpPassword {{ dbsnmp_password }}
        -emConfiguration NONE
        -storageType ASM
        -diskGroupName {{ asm_diskgroup_data }}
        -characterSet {{ db_charset }}
        -nationalCharacterSet {{ db_ncharset }}
        -memoryPercentage 20
        -sampleSchema false
        -initParams cluster_database=false
      become_user: oracle
      environment: "{{ db11_env }}"
      register: dbca11
      timeout: 7200
      changed_when: true
      failed_when:
        - dbca11.rc != 0
        - db11_registered.rc != 0     # tolerate 'already there' re-runs

    - name: Locate the ASM spfile dbca left in +DATA
      # spfile.264.1234567890 — the exact name is generated; discover it
      # instead of baking a placeholder. (asmcmd 'find', pattern-limited.)
      shell: |
        export ORACLE_HOME={{ grid_home }}
        {{ grid_home }}/bin/asmcmd ls {{ asm_diskgroup_data }}/{{ db11_name | upper }}/PARAMETERFILE/ 2>/dev/null | grep -i spfile | head -1
      become_user: grid
      register: sp11
      changed_when: false
      failed_when: false

    - name: Register db11 with GI 19c (if not registered yet)
      # MUST register from the 11g home's srvctl: GI-19c srvctl refuses to
      # create an 11.2.0.4-versioned resource (PRCD-1298 version mismatch,
      # 2026-10-27). The 11g srvctl talks to the same CRS stack; later
      # stop/start/remove via the 19c srvctl work fine on the resource.
      # No -i/-n/-r on add (prefix trap + -r SINGLE gone); instance via
      # add instance with the CRS SHORT nodename.
      shell: |
        {{ oracle11_home }}/bin/srvctl config database -d {{ db11_name }} >/dev/null 2>&1 && exit 0
        SP=""
        {% if sp11.stdout | trim %}
        SP="-p +{{ asm_diskgroup_data }}/{{ db11_name | upper }}/PARAMETERFILE/{{ sp11.stdout | trim }}"
        {% endif %}
        {{ oracle11_home }}/bin/srvctl add database -d {{ db11_name }} \
          -o {{ oracle11_home }} $SP -a {{ asm_diskgroup_data }}
        {{ oracle11_home }}/bin/srvctl add instance -d {{ db11_name }} -i {{ db11_sid }} -n {{ hostvars[groups['rac'][0]].short_name }}
      become_user: oracle
      environment: "{{ db11_env }}"
      register: db11_add
      changed_when: db11_add.rc == 0

    - name: Normalize db11 to a single instance
      # -initParams cluster_database=false (flag verified present in this
      # home's own dbca -help) keeps dbca standalone; but 11.2 dbca under a
      # live cluster may still create instances for olsnodes' full list
      # (srvctl in an 11g DB home dispatches to the active CRS home). Remove
      # any beyond node1 so the DB is genuinely single-instance.
      shell: |
        # srvctl status lines: "Instance <ins> is running on node <n>"
        {{ grid_home }}/bin/srvctl status database -d {{ db11_name }} \
          | awk '$NF != "{{ db11_node }}" {print $2}' \
          | while read -r ins; do
              {{ grid_home }}/bin/srvctl stop instance -d {{ db11_name }} -i $ins || true
              {{ grid_home }}/bin/srvctl remove instance -d {{ db11_name }} -i $ins || true
            done
        true
      become_user: grid
      changed_when: false
      failed_when: false

    - name: Ensure db11 up
      shell: |
        {{ grid_home }}/bin/srvctl start database -d {{ db11_name }} 2>&1 \
          | grep -v PRCC-1014 || true
        {{ grid_home }}/bin/srvctl status database -d {{ db11_name }}
      become_user: grid
      register: db11_status
      changed_when: true
      failed_when: "'is not running' in db11_status.stdout"

    - name: Result
      debug:
        msg: >-
          db19c: RAC CDB ({{ db_sid_prefix }}1+{{ db_sid_prefix }}2, PDB {{ pdb_name }}).
          db11: 11.2.0.4 single instance on {{ db11_node }}
          {{ '— registered' if db11_add.rc == 0 else '— already registered' }}.
          11g env: . /home/oracle/db11g.env ; connect via {{ scan_name }}:{{ scan_port }}.
