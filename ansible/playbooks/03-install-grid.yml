# ============================================================
# Playbook 03 — Grid Infrastructure 19.3 + RU 19.31 install
# Phases are SEPARATE plays: gridSetup runs on node1 only (it stages
# the peers), and root.sh order node1 -> node2 is a hard requirement.
# Run: ansible-playbook playbooks/03-install-grid.yml
# Idempotent: re-running skips completed phases via stage guards
# (gridSetup.sh present, /etc/oracle/olr.loc, CRS-4537, stat res -t).
# ============================================================

- name: GI preflight (media, ASM symlinks, NIC roles)
  hosts: rac
  gather_facts: true
  become: true
  vars:
    grid_stage: check
  roles:
    - grid

- name: GI software + cluster config (node1; gridSetup -applyRU, ~1 h)
  hosts: rac
  gather_facts: true
  become: true
  vars:
    grid_stage: software
  roles:
    - grid

- name: root.sh — node1 (forms the cluster)
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    grid_stage: root
  roles:
    - grid

- name: root.sh — node2 (joins via ConfigNode — never both at once)
  hosts: rac[1]
  gather_facts: false
  become: true
  vars:
    grid_stage: root
  roles:
    - grid

- name: DATA + FRA disk groups and cluster verification
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    grid_stage: dgs
  roles:
    - grid
