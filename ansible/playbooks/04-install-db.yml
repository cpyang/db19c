# ============================================================
# Playbook 04 — RDBMS 19c software (home: /u01/app/oracle/product/19.0.0/dbhome_1)
# Per-node LOCAL image install (tests lab's proven 19c method — the
# node1-propagating model dies on base-19.3 CVU remote checks).
# Run: ansible-playbook playbooks/04-install-db.yml
# ============================================================

- name: 19c DB preflight (media)
  hosts: rac
  gather_facts: false
  become: true
  vars:
    db_stage: check
  roles:
    - database

- name: 19c DB software + RU (per node; parallel is SAFE here)
  hosts: rac
  gather_facts: false
  become: true
  vars:
    db_stage: software
  roles:
    - database

- name: 19c DB root.sh — node1
  hosts: rac[0]
  gather_facts: false
  become: true
  vars:
    db_stage: root
  roles:
    - database

- name: 19c DB root.sh — node2
  hosts: rac[1]
  gather_facts: false
  become: true
  vars:
    db_stage: root
  roles:
    - database

- name: 19c DB home verify (binary + setuid + RU registered)
  hosts: rac
  gather_facts: false
  become: true
  vars:
    db_stage: verify
  roles:
    - database
