# ============================================================
# Playbook 02 — cluster prerequisites: shared ASM disks + ssh/DNS trust (unchanged model from db11g)
# Run: ansible-playbook playbooks/02-configure-cluster.yml
# ============================================================

- name: Provision shared ASM disks
  hosts: rac
  gather_facts: true
  become: true
  serial: 1            # node1 partitions FIRST; the peer only maps after
  roles:
    - storage

- name: Cluster prerequisite verification
  hosts: rac
  gather_facts: false
  become: true
  vars:
    ssh_users: [oracle, grid]
  tasks:
    # If a hop here is broken, the installer's CVU ssh (non-PTY, BatchMode)
    # WILL fail later with the classic INS-06006/PRVF-5311 misdirection.
    # Fail here, loudly, per-hop, while it is still cheap.
    - name: "Trust probe: installer user -> every node (incl. self)"
      command: >-
        ssh -o BatchMode=yes -o ConnectTimeout=8
        {{ hostvars[item.1].short_name }} true
      become_user: "{{ item.0 }}"
      loop: "{{ ssh_users | product(groups['rac']) | list }}"
      loop_control:
        label: "{{ item.0 }}@{{ inventory_hostname }} -> {{ item.1 }}"
      changed_when: false

    - name: "DNS probe: SCAN name must answer from local dnsmasq"
      command: nslookup {{ scan_name }} 127.0.0.1
      register: dns_probe
      changed_when: false
      failed_when: >-
        dns_probe.rc != 0 or scan_ip not in dns_probe.stdout

    - name: "Hosts probe: vip/priv/self names resolve"
      command: getent hosts {{ item }}
      loop:
        - "{{ short_name }}-vip.{{ domain_name }}"
        - "{{ short_name }}-priv.{{ domain_name }}"
        - "{{ inventory_hostname }}"
      changed_when: false
