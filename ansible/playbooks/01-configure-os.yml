# ============================================================
# Playbook 01 — OS preparation for GI 19c + DB 19c/11g on OL9 (idempotent)
# Run: ansible-playbook playbooks/01-configure-os.yml
# ============================================================

- name: Configure OS prerequisites (EL9, GI 19c + DB 19c/11g)
  hosts: rac
  gather_facts: true
  become: true

  roles:
    - common

  post_tasks:
    - name: Environment summary
      debug:
        msg: >-
          {{ inventory_hostname }}: RAM={{ ansible_memtotal_mb }}MB
          swap={{ ansible_swaptotal_mb }}MB
          public={{ pub_iface }}/{{ public_ip }}
          interconnect={{ priv_iface }}/{{ private_ip }}

    - name: Remind about the once-per-cluster reboot (SELinux enforcement)
      debug:
        msg: "If SELinux was enforcing at first boot, reboot nodes before 02."
      run_once: true
