# ============================================================
# GI 19c + DB 19c + DB 11.2.0.4 — global variables (Oracle Linux 9)
# ============================================================

# --- Installation media (host library ~/staging/{db19c,db11g} on the lab
# host, mounted read-only at /u01/media/db19c + /u01/media/db11g via DIRECT
# VBox shares — repo-staging SYMLINKS do not resolve on EL9 guests) ---
# Media identity VERIFIED against di's library (2026-10-26):
#   LINUX.X64_193000_grid_home.zip / _db_home.zip  = 19.3 BASE (unzip into OH)
#   p39036936 = GI  RU 19.31.0.0.0 (gridSetup -applyRU)
#   p39034528 = DB  RU 19.31.0.0.0 (runInstaller -applyRU / opatch)
#   p6880880  = OPatch (REPLACE the home's bundled one before any opatch call)
#   p13390677_1of7+2of7 = 11.2.0.4 RDBMS software (3of7 = GI — NOT installed;
#   GI here is 19c)
oracle_stage_dir: /u01/media/db19c
stage11_dir: /u01/media/db11g
oracle_media_dir: /u01/media
gi_base_zip: "LINUX.X64_193000_grid_home.zip"
db_base_zip: "LINUX.X64_193000_db_home.zip"
gi_ru_zip: "p39036936_190000_Linux-x86-64.zip"
db_ru_zip: "p39034528_190000_Linux-x86-64.zip"
opatch_zip: "p6880880_190000_Linux-x86-64.zip"
gi_ru_id: "39036936"
db_ru_id: "39034528"
ru_stage_dir: /u01/patches
# 11.2.0.4 media
oracle11_database_zips:
  - "p13390677_112040_Linux-x86-64_1of7.zip"
  - "p13390677_112040_Linux-x86-64_2of7.zip"

# --- Software locations ---
oracle_sw_version: "19.31.0.0"
oracle_base: /u01/app/oracle              # RDBMS base (both homes)
grid_base: /u01/app/grid                  # GI base (ASM/cmdsrv diag lives here)
oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
oracle11_home: /u01/app/oracle/product/11.2.0/dbhome_1
grid_home: /u01/app/19.0.0/grid
ora_inventory: /u01/app/oraInventory

# --- Users / groups (fixed GIDs so both nodes agree) ---
os_groups:
  oinstall: 5001
  dba:      5002
  oper:     5003
  backupdba: 5004
  dgdba:    5005
  kmdba:    5006
  racdba:   5009
  asmadmin: 5010
  asmdba:   5011
  asmoper:  5012
oracle_installer_group: oinstall
oracle_db_group: dba
oracle_asm_group: asmadmin
oracle_asm_dba_group: asmdba
oracle_asm_oper_group: asmoper

# --- Lab passwords (README: change if this ever leaves the laptop) ---
grid_password: "oracle"
oracle_password: "oracle"
asm_monitor_password: "oracle"
sys_password: "oracle"
system_password: "oracle"
dbsnmp_password: "oracle"

# --- OS packages (EL9 names; 19c has NO i686 requirements) ---
# NOTE: deliberately NOT using oracle-database-preinstall-19c — it creates
# its own oracle user (54321) and its post-install would fight the fixed-GID
# two-owner model in roles/common. List audited against ol9_baseos_latest +
# ol9_appstream on the spike VM (2026-10-26): fully satisfiable except the
# 11g-only compat libs, which 04b grafts from the OL7 repo.
oracle_packages:
  - binutils
  - gcc
  - gcc-c++
  - glibc
  - glibc-devel
  - ksh
  - libaio
  - libaio-devel
  - libnsl
  - librdmacm
  - libstdc++
  - libstdc++-devel
  - libX11
  - libXau
  - libXi
  - libXrender
  - libXtst
  - make
  - policycoreutils
  - smartmontools
  - sysstat
  - unzip
  # tooling used by bootstrap scripts / installers / CVU
  - bc
  - bind-utils
  - dnsmasq
  - nfs-utils
  - psmisc
  - xorg-x11-utils
# Timekeeping on EL9 is chrony (the `ntp` daemon of EL7 no longer exists);
# roles/common pins one explicit server (PRVF-5408, see ntp_servers below).
time_packages:
  - chrony

# --- Kernel parameters (19c RAC checklist; 16 GB nodes) ---
kernel_parameters:
  fs.aio-max-nr: "1048576"
  fs.file-max: "6815744"
  kernel.shmall: "4194304"        # 16 GB * pagesize/4k ceiling
  kernel.shmmax: "8589934592"     # half of RAM; per-instance SGA headroom
  kernel.shmmni: "4096"
  kernel.sem: "250 32000 100 128"
  net.ipv4.ip_local_port_range: "9000 65500"
  net.core.rmem_default: "262144"
  net.core.rmem_max: "4194304"
  net.core.wmem_default: "262144"
  net.core.wmem_max: "1048576"
  vm.overcommit_memory: "1"       # AMM on small VMs dies without this
  vm.min_free_kbytes: "131072"

# --- Resource limits ---
resource_limits:
  oracle:
    - { type: soft, item: nproc, value: 2047 }
    - { type: hard, item: nproc, value: 16384 }
    - { type: soft, item: nofile, value: 1024 }
    - { type: hard, item: nofile, value: 65536 }
    - { type: soft, item: memlock, value: 5000000 }
    - { type: hard, item: memlock, value: 5000000 }
  grid:
    - { type: soft, item: nproc, value: 2047 }
    - { type: hard, item: nproc, value: 16384 }
    - { type: soft, item: nofile, value: 1024 }
    - { type: hard, item: nofile, value: 65536 }
    - { type: soft, item: memlock, value: 5000000 }
    - { type: hard, item: memlock, value: 5000000 }

# --- Shared ASM disks (VBox ASM_SCSI ports 0-2) ---
# Identity = exact full-disk sector count. Sizes are DISTINCT on purpose:
# the Vagrantfile refuses to create them if two disks would share a size.
asm_disks:
  - { label: CRS,  size_gb: 12 }
  - { label: DATA, size_gb: 30 }
  - { label: FRA,  size_gb: 10 }

# --- NTP ---
# Same EXPLICIT server on both nodes: CVU's PRVF-5408 'common NTP server'
# check fails when pool.* randomizes each node onto different upstreams
# (di 2026-10-23 addNode postmortem).
ntp_servers:
  - time.google.com
